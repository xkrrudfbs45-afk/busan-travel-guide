<path d="M244 377c58 20 115 28 185 28 96 0 178-21 251-58 34 47 39 91 9 128-41 51-130 76-232 72-113-4-190-44-211-102-8-21-9-44-2-68Z" fill="url(#belly)" stroke="#d0e8f5" stroke-width="4"/>
<!-- face -->
<ellipse cx="365" cy="333" rx="22" ry="28" fill="#ffffff"/><ellipse cx="367" cy="339" rx="10" ry="15" fill="#18354c"/>
<ellipse cx="493" cy="330" rx="22" ry="28" fill="#ffffff"/><ellipse cx="495" cy="336" rx="10" ry="15" fill="#18354c"/>
