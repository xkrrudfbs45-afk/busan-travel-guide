<path d="M434 250c-12 17-17 25-17 34a17 17 0 0 0 34 0c0-9-5-17-17-34Z" fill="#f8fcff" opacity=".95"/>
</g>
<g fill="#ffffff" opacity=".9"><path d="M150 530q35-28 70 0-35-8-70 0Z"/><path d="M960 550q38-30 76 0-38-8-76 0Z"/><path d="M830 605q26-20 52 0-26-6-52 0Z"/></g>
</svg>