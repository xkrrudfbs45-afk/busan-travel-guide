name: Threads content tests

on:
  pull_request:
    paths:
      - "content/social/threads-30day/**"
      - "marketing/threads-30-day-*-calendar.md"
      - "scripts/threads/**"
      - ".github/workflows/threads-tests.yml"
  push:
    branches: [main]
    paths:
      - "content/social/threads-30day/**"
      - "marketing/threads-30-day-*-calendar.md"
      - "scripts/threads/**"
      - ".github/workflows/threads-tests.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Threads regression tests
        run: node --test scripts/threads/threads.test.mjs
      - name: Validate schedule against localized calendars
        run: node scripts/threads/build-schedule.mjs --check
      - name: Validate localized guide-link replies
        run: node scripts/threads/link-replies.mjs --check
