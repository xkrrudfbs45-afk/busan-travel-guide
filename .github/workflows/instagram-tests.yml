name: Instagram content tests

on:
  pull_request:
    paths:
      - "scripts/instagram/**"
      - "scripts/social/**"
      - "content/social/instagram/**"
      - ".github/workflows/instagram-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/instagram/**"
      - "content/social/instagram/**"
      - ".github/workflows/instagram-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate Instagram schedule and publisher
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Instagram regression tests
        run: |
          node --test scripts/instagram/instagram.test.mjs
          node scripts/social/validate-15day-drafts.mjs
