name: Technical SEO audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Fail the job on audit ERROR findings so a red check blocks deployment.
  SEO_AUDIT_STRICT: "1"

jobs:
  seo-audit:
    name: Crawl local SEO hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build the public site (same script Render runs)
        run: sh scripts/build-static.sh
      - name: Run dependency-free audit
        run: |
          node scripts/public-quality-audit.mjs public
          node scripts/seo-audit.mjs
          node scripts/sitemap-hreflang-audit.mjs
          node scripts/outbound-link-image-audit.mjs
          node scripts/build-social-calendar.mjs --check
          node scripts/social-content-audit.mjs
          node scripts/social-content-audit.mjs --self-test
          node scripts/language-switch-audit.mjs
