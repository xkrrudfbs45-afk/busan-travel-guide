name: Technical SEO audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-audit:
    name: Crawl local SEO hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run dependency-free audit
        run: |
          node scripts/seo-audit.mjs
          node scripts/sitemap-hreflang-audit.mjs
          node scripts/outbound-link-image-audit.mjs
          node scripts/language-switch-audit.mjs
