name: Technical SEO audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Fail the job on audit ERROR findings so a red check blocks deployment.
  SEO_AUDIT_STRICT: "1"

jobs:
  seo-audit:
    name: Crawl local SEO hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify deterministic EN/JA/zh-TW Busan map generation
        run: |
          python3 scripts/generate-busan-map.py
          git diff --exit-code -- guides/busan-map/index.html ja/guides/busan-map/index.html zh-tw/guides/busan-map/index.html
          python3 scripts/generate-busan-map.py
          git diff --exit-code -- guides/busan-map/index.html ja/guides/busan-map/index.html zh-tw/guides/busan-map/index.html
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          pages = [
              (Path("guides/busan-map/index.html"), ""),
              (Path("ja/guides/busan-map/index.html"), "ja"),
              (Path("zh-tw/guides/busan-map/index.html"), "zh-tw"),
          ]
          expected_ids = None
          for page_path, locale in pages:
              html = page_path.read_text(encoding="utf-8")
              blocks = re.findall(r'(<li class="g2b-place" id="place-\d+".*?</li>)', html, re.S)
              ids = [re.search(r'id="(place-\d+)"', block).group(1) for block in blocks]
              assert len(ids) == 30, f"{page_path}: expected 30 cards, found {len(ids)}"
              if expected_ids is None:
                  expected_ids = ids
              assert ids == expected_ids, f"{page_path}: place IDs differ from other locales"

              guide_hrefs = []
              for block in blocks:
                  links = re.findall(r'<a href="([^"]+)"([^>]*)>(.*?)</a>', block, re.S)
                  assert len(links) >= 3, f"{page_path}: card is missing its guide link"
                  href, attrs, _ = links[-1]
                  guide_hrefs.append(href)
                  target_path, marker, fragment = href.partition("#")
                  assert target_path.startswith("/"), f"{page_path}: non-local guide link {href}"
                  target_file = Path(target_path.lstrip("/").rstrip("/")) / "index.html"
                  assert target_file.is_file(), f"{page_path}: missing guide target {target_file}"
                  if marker:
                      target_html = target_file.read_text(encoding="utf-8")
                      assert re.search(r'\bid="' + re.escape(fragment) + r'"', target_html), f"{page_path}: missing anchor #{fragment} in {target_file}"
                  if locale and target_path.startswith("/guides/"):
                      assert 'hreflang="en"' in attrs and 'lang="en"' in attrs, f"{page_path}: English fallback not labelled"
                  if locale and target_path.startswith(f"/{locale}/"):
                      assert 'hreflang="en"' not in attrs, f"{page_path}: localized guide incorrectly labelled English"

              scripts = re.findall(r'<script type="application/ld\+json">(.*?)</script>', html, re.S)
              page = next(json.loads(item) for item in scripts if json.loads(item).get("@type") == "CollectionPage")
              item_list = page["mainEntity"]
              assert item_list["numberOfItems"] == len(ids) == len(item_list["itemListElement"]), f"{page_path}: ItemList count mismatch"
              item_urls = [item["url"].replace("https://go2busan.com", "") for item in item_list["itemListElement"]]
              assert item_urls == guide_hrefs, f"{page_path}: ItemList URLs differ from visible guide links"
          PY

      - name: Build the public site (same script Render runs)
        run: sh scripts/build-static.sh
      - name: Run dependency-free audit
        run: |
          node scripts/public-quality-audit.mjs public
          node scripts/seo-audit.mjs
          node scripts/sitemap-hreflang-audit.mjs
          node scripts/outbound-link-image-audit.mjs
          node scripts/homepage-food-image-audit.mjs
          node scripts/image-credit-audit.mjs --strict
          node scripts/analytics-navigation-audit.mjs
          node scripts/build-social-calendar.mjs --check
          node scripts/social-content-audit.mjs
          node scripts/social-content-audit.mjs --self-test
          node scripts/language-switch-audit.mjs
          node scripts/inject-affiliate-cta.mjs --check
          node scripts/inject-agoda-cta.mjs --check
          node scripts/enhance-images.mjs --check
          node scripts/enhance-social-meta.mjs --check public
