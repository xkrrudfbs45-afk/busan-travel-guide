name: Weekly Lighthouse performance audit

on:
  schedule:
    - cron: "30 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Measure mobile and desktop performance
    runs-on: ubuntu-latest
    steps:
      - name: Run Lighthouse against key landing pages
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://go2busan.com/
            https://go2busan.com/ja/
            https://go2busan.com/zh-tw/
            https://go2busan.com/guides/busan-three-days/
            https://go2busan.com/guides/busan-neighborhood-food-guide/
            https://go2busan.com/ja/guides/local-food-by-neighborhood/
            https://go2busan.com/zh-tw/guides/local-food-by-neighborhood/
            https://go2busan.com/ja/guides/three-days/
            https://go2busan.com/zh-tw/guides/three-days/
            https://go2busan.com/guides/busan-transit-card/
            https://go2busan.com/guides/visit-busan-pass-guide/
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: false
