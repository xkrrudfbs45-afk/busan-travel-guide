name: Growth ops (4-hourly scan)

# Every 4 hours (UTC 00,04,08,12,16,20 = KST 09,13,17,21,01,05):
#   scan   - build the site, run the audit suite, technical SEO + affiliate + coverage scan,
#            live-site checks, social publish logs (read-only, no Meta API calls),
#            Search Console / GA4 when credentials exist. Posts the report to the
#            open issue labelled "growth-log".
#   autopilot (optional, off by default) - when repository variable GROWTH_AUTOPILOT == 'true'
#            and secret CLAUDE_CODE_OAUTH_TOKEN exist, Claude picks ONE item from the report and
#            opens a DRAFT pull request. It never merges, deploys, edits secrets or social schedules.
# Pull requests that touch this workflow or scripts/growth run the scan as a self-test
# (report goes to the job summary only).

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      autopilot:
        description: "Run the autopilot job after the scan (still requires GROWTH_AUTOPILOT=true)"
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/growth-ops.yml"
      - "scripts/growth/**"

concurrency:
  group: growth-ops-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    name: Scan site, data and social logs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      priorities: ${{ steps.scan.outputs.priorities }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch social state branches (read-only)
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main || echo "main not fetched"
          git fetch --no-tags --depth=1 origin +refs/heads/threads-state:refs/remotes/origin/threads-state || echo "threads-state not available"
          git fetch --no-tags --depth=1 origin +refs/heads/instagram-state:refs/remotes/origin/instagram-state || echo "instagram-state not available"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build the public site (same script Render runs)
        run: sh scripts/build-static.sh
      - name: Run growth scan
        id: scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY: ${{ vars.GSC_PROPERTY }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
        run: |
          node scripts/growth/scan.mjs --public public --out growth-report
          cat growth-report/report.md >> "$GITHUB_STEP_SUMMARY"
          echo "priorities=$(node -e 'console.log(require("./growth-report/report.json").priorities.length)')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: growth-report-${{ github.run_id }}
          path: growth-report/
          retention-days: 30
      - name: Post report to the growth-log issue
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh label create growth-log --color 0E8A16 --description "4-hourly growth scan log" 2>/dev/null || true
          n=$(gh issue list --label growth-log --state open --limit 1 --json number -q '.[0].number')
          [ -n "$n" ] || n=$(gh issue list --search 'in:title "Growth ops log"' --state open --limit 1 --json number -q '.[0].number')
          if [ -z "$n" ]; then
            n=$(gh issue create --title "Growth ops log (4-hourly scan)" --label growth-log \
              --body "Automated log from .github/workflows/growth-ops.yml. Each comment is one scan. Numbers marked 'no access' are not estimated." | grep -o '[0-9]*$')
          fi
          if [ -s growth-report/report.md ]; then cat growth-report/report.md > comment.md; else echo "## Growth scan FAILED before a report was written — see the run log. The next scheduled run retries automatically." > comment.md; fi
          echo "" >> comment.md; echo "[Run log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> comment.md
          gh issue comment "$n" --body-file comment.md

  autopilot:
    name: Autopilot (draft PR, optional)
    needs: scan
    if: >-
      github.event_name != 'pull_request' &&
      vars.GROWTH_AUTOPILOT == 'true' &&
      (github.event_name == 'schedule' || inputs.autopilot)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Check credentials and open autopilot PRs
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "CLAUDE_CODE_OAUTH_TOKEN not set: skipping" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          open=$(gh pr list -R "$GITHUB_REPOSITORY" --label growth-autopilot --state open --json number -q 'length')
          if [ "$open" -ge 1 ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "$open autopilot PR still open: waiting for review before opening another (max 1)" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: growth-report-${{ github.run_id }}
          path: growth-report
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "20"
      - name: Claude picks one item and edits files (no git, no build, no PR)
        if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true  # tool calls visible in the run log for review; secrets stay masked
          # Claude only reads and edits files. Branching, build, audits, commit, push and the draft PR are done
          # by the deterministic steps below, so Claude has no git-push or GitHub-write ability at all.
          claude_args: >-
            --max-turns 50
            --allowedTools "Read,Edit,Write,Glob,Grep,WebFetch,WebSearch,Bash(gh pr list:*),Bash(gh pr view:*),Bash(git status:*),Bash(git diff:*),Bash(ls:*),Bash(grep:*),Bash(node scripts/inject-affiliate-cta.mjs --check)"
          prompt: |
            You are the Go2Busan growth autopilot. Read AGENTS.md, CONTENT_GUIDELINES.md,
            docs/ai-workspace/WORK-DIVISION-CHATGPT-CLAUDE.md, docs/ai-workspace/STATUS.md and growth-report/report.md.
            Run `gh pr list --state open` and skip anything an open PR already covers.
            Pick exactly ONE item from "Next priorities" with the best evidence and smallest risk, and make the edit with
            the Edit/Write tools. Technical items (metadata, schema, internal links, affiliate CTA data in
            content/affiliate/*.json, CSS/JS, build scripts) are your lane. Content items (new page or body text): write a
            draft only if every fact can be cited to an official or primary source you actually opened; never claim a visit.
            Do NOT run git commands that change state, the build, or create PRs: the workflow builds, runs every audit,
            commits and opens the draft PR after you finish, and discards your change if any audit fails.
            Finally write growth-report/autopilot-summary.md with: first line = a short PR title; then the evidence from the
            report, what you changed and why, and anything a reviewer must check. If nothing is worth changing, edit no
            files and write only "NO_CHANGE: <reason>" to that file.
            Never edit: .github/, content/social/, scripts/growth/, secrets, GA4 consent/measurement code
            (assets/js/analytics.js), URLs/redirects, sitemap URLs of existing pages, Klook aid or existing aff_adid values.
      - name: Validate, build and audit Claude's change
        id: verify
        if: steps.gate.outputs.run == 'true'
        run: |
          set -u
          changed=$(git status --porcelain --untracked-files=all | awk '{print $2}' | grep -v '^growth-report/' || true)
          if [ -z "$changed" ]; then echo "result=no-change" >> "$GITHUB_OUTPUT"; echo "No file changes." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          echo "$changed" > /tmp/changed.txt
          if grep -E '^(\.github/|content/social/|scripts/growth/|assets/js/analytics\.js)' /tmp/changed.txt; then
            echo "result=blocked-path" >> "$GITHUB_OUTPUT"; echo "Change touched a protected path; discarded." >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          fails=""
          sh scripts/build-static.sh > /tmp/build.log 2>&1 || fails="build"
          for a in "public-quality-audit.mjs public" "seo-audit.mjs" "sitemap-hreflang-audit.mjs" "outbound-link-image-audit.mjs" "homepage-food-image-audit.mjs" "image-credit-audit.mjs --strict" "analytics-navigation-audit.mjs" "build-social-calendar.mjs --check" "social-content-audit.mjs" "social-content-audit.mjs --self-test" "language-switch-audit.mjs" "inject-affiliate-cta.mjs --check"; do
            if node scripts/$a > /tmp/a.log 2>&1; then echo "- ✅ $a" >> /tmp/audits.md; else echo "- ❌ $a: $(tail -2 /tmp/a.log | tr '\n' ' ' | cut -c1-200)" >> /tmp/audits.md; fails="$fails $a"; fi
          done
          node scripts/growth/scan.mjs --public public --out /tmp/after --offline > /dev/null 2>&1 && sed -n '/### Technical SEO/,/### CI audit/p' /tmp/after/report.md | head -12 >> /tmp/audits.md || true
          cat /tmp/audits.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$fails" ]; then echo "result=audit-failed" >> "$GITHUB_OUTPUT"; exit 1; fi
          echo "result=ok" >> "$GITHUB_OUTPUT"
      - name: Commit to an autopilot branch and open a draft PR
        if: steps.verify.outputs.result == 'ok'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          title=$(head -1 growth-report/autopilot-summary.md 2>/dev/null | cut -c1-90)
          [ -n "$title" ] || title="Growth autopilot change"
          br="autopilot/run-${GITHUB_RUN_ID}"
          git config user.name "go2busan-autopilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$br"
          git add -A -- . ':!growth-report' ':!public'
          git commit -q -m "$title" -m "Growth autopilot run ${GITHUB_RUN_ID}. Co-Authored-By: Claude <noreply@anthropic.com>"
          git push -q origin "$br"
          { tail -n +2 growth-report/autopilot-summary.md 2>/dev/null; echo; echo "## Audits run by the workflow"; cat /tmp/audits.md; echo; echo "Draft opened by growth-ops run ${GITHUB_RUN_ID}. CI does not auto-run on bot PRs: close/reopen to trigger it. Owner approval required to merge."; } > /tmp/body.md
          gh label create growth-autopilot --color FBCA04 --description "Draft PR from the growth autopilot" 2>/dev/null || true
          gh pr create --draft --base main --head "$br" --title "[autopilot] $title" --body-file /tmp/body.md --label growth-autopilot
      - name: Record the autopilot result on the growth-log issue
        if: always() && steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ job.status }}
          RESULT: ${{ steps.verify.outputs.result }}
        run: |
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --search 'in:title "Growth ops log"' --state open --limit 1 --json number -q '.[0].number')
          pr=$(gh pr list -R "$GITHUB_REPOSITORY" --label growth-autopilot --state open --json number,url -q '.[0].url // "none"')
          why=$(head -c 300 growth-report/autopilot-summary.md 2>/dev/null | tr '\n' ' ' || true)
          [ -n "$n" ] && gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "Autopilot run ${GITHUB_RUN_ID}: **${OUTCOME}** · result: \`${RESULT:-n/a}\` · open autopilot PR: ${pr} · summary: ${why:-none} · [log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). A failed or discarded run changes nothing; the next 4-hourly run retries." || true
